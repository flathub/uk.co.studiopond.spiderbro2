app-id: uk.co.studiopond.spiderbro2
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: spiderbro2_linux
finish-args:
  - --socket=pulseaudio
  - --socket=x11
  - --device=dri
  - --share=ipc
modules:
  - shared-modules/glu/glu-9.json
  - name: Spiderbro-2
    buildsystem: simple
    build-commands:
      - install -Dm755 spiderbro2_linux -t /app/bin/
      - install -Dm755 polybius2_linux -t /app/bin/
      - install -Dm755 polybius_linux -t /app/bin/
      - install -Dm755 vameforspiderbroforspiderbro2_linux -t /app/bin/
      - cp -r data /app/bin/data
      - unzip -o polydata2.zip -d /app/bin
      - unzip -o polydata.zip -d /app/bin
      - unzip -o spiderbrodata.zip -d /app/bin
      - install -D uk.co.studiopond.spiderbro2.svg -t /app/share/icons/hicolor/scalable/apps/
      - install -D uk.co.studiopond.spiderbro2.desktop -t /app/share/applications/
      - install -D uk.co.studiopond.spiderbro2.metainfo.xml -t /app/share/metainfo/
    sources:
     - type: archive
       url: https://github.com/pforpond/Spiderbro-2/releases/download/2.1/Spiderbro2-Flatpak.zip
       sha256: faca10bdff7c496988f71ab152b4856871c24cc55edabcdd607ce1905d26f586
       strip-components: 0
